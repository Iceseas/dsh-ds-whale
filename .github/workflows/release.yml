name: release

# 只需推一个 tag：git tag -a v0.9.3 -m "v0.9.3" && git push origin v0.9.3
# 这个 workflow 会校验版本号、打包 zip、生成 Release（说明取自 CHANGELOG + 提交历史）。
# 它不依赖仓库里的任何本地脚本，全部逻辑都在这里。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成变更说明需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 tag 与 package.json 版本一致
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 里的 $PKG 不一致"
            exit 1
          fi
          MAJOR="${TAG%%.*}"
          PRE="false"
          case "$TAG" in
            *-*) PRE="true" ;;
            *)
              if [ "$MAJOR" = "0" ]; then PRE="true"; fi
              ;;
          esac
          # 0.x 默认算预发布（GitHub 的 /releases/latest 不会指向预发布，仓库首页也不显示）。
          # 想让某一版变成正式版：在 CHANGELOG 该版段落里写一行 [stable]，
          # 或者发版时直接 node scripts/release.mjs patch --stable -m "..."
          if sed -n "/^## $TAG/,/^## /p" CHANGELOG.md | grep -q '\[stable\]'; then
            PRE="false"
            echo "CHANGELOG 里标了 [stable]，按正式版发布"
          fi
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: 打包 zip（根层 package.json、只取 package.json 的 files）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 清单 = package.json 的 files + package.json 自己；不扫目录，仓库里的杂物进不去
          node -e "const p=require('./package.json');const fs=require('fs');const l=[...p.files,'package.json'];for(const f of l){if(!fs.existsSync(f)){console.error('::error::缺少文件 '+f);process.exit(1)}}fs.writeFileSync('ziplist.txt',l.join('\n')+'\n');console.log('打包 '+l.length+' 个文件')"
          zip -q -X -r "dsh-ds-whale-$VERSION.zip" -@ < ziplist.txt
          echo "--- zip 内容 ---"
          unzip -l "dsh-ds-whale-$VERSION.zip" | sed -n '1,30p'
          echo "size=$(wc -c < "dsh-ds-whale-$VERSION.zip") bytes"
          unzip -l "dsh-ds-whale-$VERSION.zip" | grep -q ' package.json$' || { echo '::error::package.json 不在 zip 根层'; exit 1; }

      - name: 生成 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          PREV=$(git tag --sort=-v:refname | grep -v "^v$VERSION$" | head -n1 || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..v$VERSION"; else RANGE="v$VERSION"; fi
          NOTES="notes.md"
          {
            echo "## v$VERSION"
            echo
            # CHANGELOG 里本版那一段（到下一个二级标题为止）
            sed -n "/^## $VERSION/,/^## /p" CHANGELOG.md | sed '$d'
            echo
            echo "### 变更提交"
            echo
            # 发版提交本身没有信息量，别塞进 Release 说明里
            git log "$RANGE" --no-merges --pretty='- %s (%h)' | grep -v 'chore(release):' | sed -n '1,40p' || true
            echo
            echo "### 安装"
            echo
            echo '```bash'
            echo "dsh plugin add github:Iceseas/dsh-ds-whale#v$VERSION"
            echo '```'
            echo
            echo "免 git 安装：下载下方 \`dsh-ds-whale-$VERSION.zip\`，把整份内容合并进 \`<DSH_HOME>/profiles/<profile>/node_modules/dsh-ds-whale/\`，重启 DSH 即可。"
          } > "$NOTES"
          cat "$NOTES"
          # 同一个 tag 重推会走到这里：Release 已经存在，create 会直接报错退出。
          # 所以先探测，存在就 edit 状态（含正式版/预发布）+ upload --clobber 覆盖附件。
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION 已存在 → 更新标题、说明与附件"
            if [ "$PRERELEASE" = "true" ]; then
              gh release edit "v$VERSION" --title "v$VERSION" --notes-file "$NOTES" --prerelease
            else
              gh release edit "v$VERSION" --title "v$VERSION" --notes-file "$NOTES" --prerelease=false --latest
            fi
            gh release upload "v$VERSION" "dsh-ds-whale-$VERSION.zip" --clobber
          else
            PRE_FLAG=""
            if [ "$PRERELEASE" = "true" ]; then PRE_FLAG="--prerelease"; fi
            gh release create "v$VERSION" \
              "dsh-ds-whale-$VERSION.zip" \
              --title "v$VERSION" \
              --notes-file "$NOTES" \
              $PRE_FLAG
          fi
