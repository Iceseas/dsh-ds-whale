name: release

# 只需推一个 tag：git tag -a v0.9.3 -m "v0.9.3" && git push origin v0.9.3
# 这个 workflow 会校验版本号、打包 zip、生成 Release（说明取自 CHANGELOG + 提交历史）。
# 它不依赖仓库里的任何本地脚本，全部逻辑都在这里。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成变更说明需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验 tag 与 package.json 版本一致
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 里的 $PKG 不一致"
            exit 1
          fi
          MAJOR="${TAG%%.*}"
          PRE="false"
          case "$TAG" in
            *-*) PRE="true" ;;
            *)
              if [ "$MAJOR" = "0" ]; then PRE="true"; fi
              ;;
          esac
          # 0.x 默认算预发布（GitHub 的 /releases/latest 不会指向预发布，仓库首页也不显示）。
          # 想让某一版变成正式版：发版时直接 node scripts/release.mjs patch --stable -m "..."
          # 它会在 CHANGELOG 该版段落末尾写一行 HTML 注释 <!-- dsh-release: stable -->，
          # 渲染不可见、只在源码里给这个 workflow 认。（旧版写的是 [stable]，这里兼容老 tag。）
          if sed -n "/^## $TAG/,/^## /p" CHANGELOG.md | grep -qE '\[stable\]|dsh-release:[[:space:]]*stable'; then
            PRE="false"
            echo "CHANGELOG 里标了正式版标记，按正式版发布"
          fi
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: 打包 zip（根层 package.json、只取 package.json 的 files）
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 清单 = package.json 的 files + package.json 自己；不扫目录，仓库里的杂物进不去
          node -e "const p=require('./package.json');const fs=require('fs');const l=[...p.files,'package.json'];for(const f of l){if(!fs.existsSync(f)){console.error('::error::缺少文件 '+f);process.exit(1)}}fs.writeFileSync('ziplist.txt',l.join('\n')+'\n');console.log('打包 '+l.length+' 个文件')"
          zip -q -X -r "dsh-ds-whale-$VERSION.zip" -@ < ziplist.txt
          echo "--- zip 内容 ---"
          unzip -l "dsh-ds-whale-$VERSION.zip" | sed -n '1,30p'
          echo "size=$(wc -c < "dsh-ds-whale-$VERSION.zip") bytes"
          unzip -l "dsh-ds-whale-$VERSION.zip" | grep -q ' package.json$' || { echo '::error::package.json 不在 zip 根层'; exit 1; }

      - name: 生成 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES="notes.md"
          {
            echo "## v$VERSION"
            echo
            # 正文只放 CHANGELOG 里本版那一段（到下一个二级标题为止）。
            # 1d 去掉段落首行 "## x.y.z — 日期"（标题已经由上面 echo 过了，免得出现两个版本号标题）；
            # 不附「变更提交」列表：内部提交（ci / chore / 发版流程细节）是给自己看的，
            # 对外只留手写的功能说明；正式版标记是 HTML 注释，也一并过滤掉。
            sed -n "/^## $VERSION/,/^## /p" CHANGELOG.md | sed '$d;1d' | grep -v 'dsh-release:' || true
            echo
            echo "### 安装"
            echo
            echo '```bash'
            echo "dsh plugin add github:Iceseas/dsh-ds-whale#v$VERSION"
            echo '```'
            echo
            echo "免 git 安装：下载下方 \`dsh-ds-whale-$VERSION.zip\`，把整份内容合并进 \`<DSH_HOME>/profiles/<profile>/node_modules/dsh-ds-whale/\`，重启 DSH 即可。"
          } > "$NOTES"
          cat "$NOTES"
          # 同一个 tag 重推会走到这里，而且「删掉 tag 再重推」之后过去那个 Release 可能变成
          # draft 甚至查不到——所以统一用 API 走：先按 tag_name 找 id，找到就 PATCH 覆盖状态与
          # 说明、再 upload --clobber 换附件；找不到才 create。
          # 不用 gh release edit --prerelease=false --latest：gh 认为这两个 flag 互斥会直接报错。
          if [ "$PRERELEASE" = "true" ]; then
            WANT_PRE="true"; WANT_LATEST="false"
          else
            WANT_PRE="false"; WANT_LATEST="true"
          fi
          REL_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"v$VERSION\") | .id" | head -n1 || true)
          if [ -n "$REL_ID" ]; then
            echo "Release v$VERSION 已存在（id=$REL_ID）→ PATCH 更新"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$REL_ID" \
              -f name="v$VERSION" \
              -F body=@"$NOTES" \
              -F draft=false \
              -F prerelease="$WANT_PRE" \
              -F make_latest="$WANT_LATEST" > /dev/null
            echo "状态已更新：prerelease=$WANT_PRE make_latest=$WANT_LATEST"
            gh release upload "v$VERSION" "dsh-ds-whale-$VERSION.zip" --clobber
          else
            echo "Release v$VERSION 不存在 → 新建（prerelease=$WANT_PRE）"
            if [ "$WANT_PRE" = "true" ]; then
              gh release create "v$VERSION" "dsh-ds-whale-$VERSION.zip" \
                --title "v$VERSION" --notes-file "$NOTES" --prerelease
            else
              gh release create "v$VERSION" "dsh-ds-whale-$VERSION.zip" \
                --title "v$VERSION" --notes-file "$NOTES" --latest
            fi
          fi
